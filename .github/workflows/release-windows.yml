name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: windows-latest
    env:
      IRFLOW_UPDATE_BASE_URL: ${{ vars.IRFLOW_UPDATE_BASE_URL }}
      IRFLOW_UPDATE_CHANNEL: ${{ vars.IRFLOW_UPDATE_CHANNEL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build renderer
        run: npm run build:renderer

      - name: Bundle Hayabusa
        shell: bash
        run: npm run bundle:hayabusa

      - name: Bundle bmc-tools
        shell: bash
        run: npm run bundle:bmc-tools

      - name: Package Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --config electron-builder.config.cjs --win

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/IRFlow-Timeline-*-x64.exe
            release/IRFlow-Timeline-*-x64.exe.blockmap
            release/latest.yml
